name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint need the history of the pushed range
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check commit messages
        run: pnpm exec commitlint --from "$FROM" --to "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:layers
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
