name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint need the history of the pushed range
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check commit messages
        run: pnpm exec commitlint --from "$FROM" --to "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:layers
      - run: pnpm typecheck
      - name: Install Chromium for browser tests
        run: pnpm --filter @veilo/core exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - name: Check built entry points
        run: pnpm --filter @veilo/core check:entries

  # Playwright tests of the built playground, in the same image `pnpm --filter playground visual`
  # uses locally, so screenshots match. Keep the tag equal to the `playwright` version.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Chromium needs more shared memory than Docker's default.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - name: Upload the report and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report/
            apps/playground/test-results/
          retention-days: 14
